[[story]]
name = "Place an order"

[[story.step]]
edge = "customer-to-web-app"
caption = "The customer checks out in the web app"

[[story.step]]
edge = "web-app-to-api-gateway"
caption = "The web app sends the order to the API"

[[story.step]]
edge = "api-gateway-to-orders-service"
caption = "The gateway routes it to the Orders Service"

[[story.step]]
edge = "orders-service-to-orders-db"
caption = "The order is saved"

[[story.step]]
edge = "orders-service-to-event-bus"
caption = "An OrderPlaced event is published"

[[story.step]]
edge = "event-bus-to-notification-worker"
caption = "The worker picks up the event"

[[story.step]]
edge = "notification-worker-to-email-provider"
caption = "A confirmation email is sent"
